# Builds the acnologia server for Linux, macOS and Windows (amd64 and arm64)
# and attaches it to the GitHub release of a v* tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The binary embeds the dashboard and the docs, so the web build and
# `make llms` run first; then Go cross compiles every target from Ubuntu
# (the SQLite driver is pure Go, CGO is off).
#
# Only first-party actions, pinned to commits.
name: release-server

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build the dashboard
        working-directory: web
        run: |
          npm install -g pnpm@10.24.0
          pnpm install --frozen-lockfile
          pnpm build

      - name: Copy the docs into the binary
        run: make llms

      - name: Test
        working-directory: server
        run: go test ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="$TAG"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            work="build/acnologia_${os}_${arch}"
            mkdir -p "$work"
            bin="acnologia"
            if [ "$os" = windows ]; then bin="acnologia.exe"; fi
            (cd server && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "../${work}/${bin}" ./cmd/acnologia)
            if [ "$os" = windows ]; then
              (cd "$work" && zip -q -X "../../dist/acnologia_${os}_${arch}.zip" "$bin")
            else
              tar -C "$work" -czf "dist/acnologia_${os}_${arch}.tar.gz" "$bin"
            fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Acnologia ${TAG}" \
              --notes "The acnologia server. Unpack the archive for your OS and CPU and run acnologia (acnologia.exe on Windows). Docs: https://github.com/${GITHUB_REPOSITORY}#readme"
          fi
          gh release upload "$TAG" dist/* --clobber
