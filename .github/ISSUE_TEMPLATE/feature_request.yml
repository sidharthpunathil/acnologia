name: Feature request
description: Suggest a feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you picture it working. Screens, API calls or config are all useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
