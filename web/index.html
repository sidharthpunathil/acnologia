<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Acnologia: share API keys without giving them away</title>
    <meta name="description" content="Share API keys without giving them away. Acnologia is a self-hosted key server: apps, AI agents, people and other servers get their own tokens, and you keep the keys." />

    <!-- Private dashboard: never index, follow, archive or show snippets. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eeede9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151412" />
    <!-- Applies the saved theme before first paint so there is no flash. Mirrors src/stores/theme.ts. -->
    <script>
      (function () {
        var pref = "system";
        try {
          // Preferences saved before the rename live under cogito.theme; move it.
          var old = localStorage.getItem("cogito.theme");
          if (old !== null) {
            if (localStorage.getItem("acn.theme") === null) localStorage.setItem("acn.theme", old);
            localStorage.removeItem("cogito.theme");
          }
          var v = localStorage.getItem("acn.theme");
          if (v === "light" || v === "dark" || v === "system") pref = v;
        } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        var theme = dark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        if (dark) document.documentElement.classList.add("dark");
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          metas[i].removeAttribute("media");
          metas[i].setAttribute("content", dark ? "#151412" : "#eeede9");
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Acnologia" />
    <meta property="og:title" content="Acnologia: share API keys without giving them away" />
    <meta property="og:description" content="A self-hosted key server. Apps, AI agents, people and other servers get their own tokens. You keep the keys." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Acnologia: share your API keys without giving them away." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Acnologia: share API keys without giving them away" />
    <meta name="twitter:description" content="A self-hosted key server. Apps, AI agents, people and other servers get their own tokens. You keep the keys." />
    <meta name="twitter:image" content="/og.png" />
    <meta name="twitter:image:alt" content="Acnologia: share your API keys without giving them away." />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
