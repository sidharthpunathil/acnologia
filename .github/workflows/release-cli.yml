# Builds the acn command line client for every platform and attaches it to
# the GitHub release of a cli-v* tag. install.sh downloads from there.
#
#   git tag cli-v0.1.0 && git push origin cli-v0.1.0
#
# Only first-party actions, pinned to commits.
name: release-cli

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test the client
        working-directory: server
        run: go test ./internal/ctl/...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#cli-}"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            work="build/acn_${os}_${arch}"
            mkdir -p "$work"
            bin="acn"
            if [ "$os" = windows ]; then bin="acn.exe"; fi
            (cd server && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "../${work}/${bin}" ./cmd/acn)
            if [ "$os" = windows ]; then
              (cd "$work" && zip -q "../../dist/acn_${os}_${arch}.zip" "$bin")
            else
              tar -C "$work" -czf "dist/acn_${os}_${arch}.tar.gz" "$bin"
            fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "acn ${TAG#cli-}" \
              --notes "The acn command line client. Install: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh"
          fi
          gh release upload "$TAG" dist/* --clobber
