<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"canvas","type":"color","label":"Canvas","default":"#eeede9"},
    {"id":"ink","type":"color","label":"Ink","default":"#18181a"},
    {"id":"violet","type":"color","label":"Accent","default":"#6d4bd8"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Acnologia</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --canvas: #eeede9;
        --ink: #18181a;
        --muted: #6b6a66;
        --line: #dedcd5;
        --card: #ffffff;
        --violet: #6d4bd8;
        --violet-soft: #ece7fb;
        --red: #c8372d;
        --red-soft: #fbe6e3;
        --green: #2f8a4c;
        --green-soft: #e3f3e7;
        --sans: "Inter", sans-serif;
        --mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--canvas);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--canvas);
        font-family: var(--sans);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="48"
      data-width="1920"
      data-height="1080"
    >
      <div id="problem" data-composition-id="problem" data-composition-src="compositions/problem.html"
        class="clip" data-start="0" data-duration="9.9" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
        class="clip" data-start="9.9" data-duration="5.4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="flow" data-composition-id="flow" data-composition-src="compositions/flow.html"
        class="clip" data-start="15.3" data-duration="9.2" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="rotate" data-composition-id="rotate" data-composition-src="compositions/rotate.html"
        class="clip" data-start="24.5" data-duration="3.3" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="share" data-composition-id="share" data-composition-src="compositions/share.html"
        class="clip" data-start="27.8" data-duration="7.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="mcp" data-composition-id="mcp" data-composition-src="compositions/mcp.html"
        class="clip" data-start="35.3" data-duration="5.3" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        class="clip" data-start="40.6" data-duration="7.4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        class="clip" data-start="0" data-duration="40.6" data-track-index="2" data-track-kind="captions"
        data-width="1920" data-height="1080"></div>

      <audio id="voiceover" class="clip" src="assets/voiceover.mp3" data-start="0.5" data-duration="44.1"
        data-track-index="3" data-volume="1"></audio>
      <audio id="revoke-click" class="clip" src="assets/click.mp3" data-start="32.85" data-duration="0.8"
        data-track-index="4" data-volume="1.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
