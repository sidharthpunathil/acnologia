    <!-- Private dashboard: never index, follow, archive or show snippets. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eeede9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151412" />
    <!-- Applies the saved theme before first paint so there is no flash. Mirrors src/stores/theme.ts. -->
    <script>
      (function () {
        var pref = "system";
        try {
          var v = localStorage.getItem("cogito.theme");
          if (v === "light" || v === "dark" || v === "system") pref = v;
        } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        var theme = dark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        if (dark) document.documentElement.classList.add("dark");
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          metas[i].removeAttribute("media");
          metas[i].setAttribute("content", dark ? "#151412" : "#eeede9");
        }
      })();
    </script>
