# Tests the Go server and CLI, the SDKs, the dashboard build and the PowerShell
# scripts. Every job runs offline against fakes, so the whole run stays short.
#
# Billing comes first here:
#   - Only a push to main runs ci. Day to day work goes to the stage branch,
#     which runs nothing; merging stage (or a pull request) into main tests
#     the whole batch in one run. Pull requests themselves run nothing.
#   - A push runs on Linux only, without -race. Hosted macOS minutes bill at
#     ten times Linux and Windows at twice, and the macOS legs were most of
#     the bill.
#   - A newer push to main cancels the older run. Nothing is lost: the next
#     run diffs against the last commit a run passed on.
#   - Every job has a timeout, so a hung test cannot burn minutes.
# A manual run is the full check: the macOS and Windows legs, -race, and the
# windows build job. Run one before a release or after an OS specific change:
#   gh workflow run ci.yml --ref main
#
# The changes job decides which jobs a commit needs, so nothing is built or
# tested again unless its own files changed:
#   go          server Go code (not the embedded docs)
#   docs        only the embedded docs changed: their tests
#   go-sdk      sdk/go          python-sdk  sdk/python
#   ruby-sdk    sdk/ruby        ts-sdk      sdk/typescript
#   (and the c, cpp, elixir, haskell, lua and zig SDKs under sdk/)
#   web         web/
#   windows     the build tooling (build.ps1, install.ps1, go.mod, the web
#               lockfile), full runs only
# Editing this file does not run anything by itself (lint it locally with
# actionlint). A manual run, or a push it cannot diff, runs them all. A skipped job counts as passed for
# branch protection. A push that only changes docs, Markdown, the video or
# images runs nothing (paths-ignore).
#
# checkout and setup-go are pinned to the same commits as the release
# workflows; the other first-party actions to a major version.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      # Documentation, the video and images only: nothing here is built or
      # tested, so such a push runs no jobs. A push that also touches code
      # runs as usual.
      - "**.md"
      - "LICENSE"
      - "video/**"
      - "docs/**"
      - "server/internal/docsmd/**"
      - "server/internal/llmstxt/**"
      - ".github/ISSUE_TEMPLATE/**"
  # The full check on demand.
  workflow_dispatch:

permissions:
  contents: read
  # The changes job looks up the last successful run on the branch.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.diff.outputs.full }}
      go: ${{ steps.diff.outputs.go }}
      docs: ${{ steps.diff.outputs.docs }}
      gosdk: ${{ steps.diff.outputs.gosdk }}
      python: ${{ steps.diff.outputs.python }}
      ruby-sdk: ${{ steps.diff.outputs.ruby-sdk }}
      c-sdk: ${{ steps.diff.outputs.c-sdk }}
      cpp-sdk: ${{ steps.diff.outputs.cpp-sdk }}
      elixir-sdk: ${{ steps.diff.outputs.elixir-sdk }}
      haskell-sdk: ${{ steps.diff.outputs.haskell-sdk }}
      lua-sdk: ${{ steps.diff.outputs.lua-sdk }}
      zig-sdk: ${{ steps.diff.outputs.zig-sdk }}
      typescript: ${{ steps.diff.outputs.typescript }}
      web: ${{ steps.diff.outputs.web }}
      windows: ${{ steps.diff.outputs.windows }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Find the changed areas
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
            push)
              # The newest ci run on this branch that passed: everything up
              # to its commit was tested. Its own skips are safe, since it
              # was diffed the same way.
              from=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=$BRANCH&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
              echo "Last passing commit: ${from:-none}"
              range="$from..$SHA"
              # The commit must be an ancestor; after a force push it may not be.
              if [ -n "$from" ] && ! git merge-base --is-ancestor "$from" "$SHA" 2>/dev/null; then from=""; fi
              ;;
            *) from="" ;;
          esac
          # A push tests on Linux only; a manual run is the full check.
          if [ "$EVENT" = workflow_dispatch ]; then full=true; else full=false; fi
          echo "full=$full" | tee -a "$GITHUB_OUTPUT"
          all=false
          if [ -z "$from" ] || [ -z "${from//0/}" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            all=true
            echo "Cannot diff this run, so every job runs."
          else
            files=$(git diff --name-only "$range")
            printf 'Changed files:\n%s\n' "$files"
          fi
          # The docs copied into the server (make llms) are not Go code.
          embedded='^server/internal/(docsmd/(files|assets)/|llmstxt/.*\.txt$)'
          code=$(grep -vE "$embedded" <<<"$files" || true)
          area() {
            if [ "$all" = true ] || grep -qE "$3" <<<"$2"; then v=true; else v=false; fi
            echo "$1=$v" | tee -a "$GITHUB_OUTPUT"
          }
          area go "$code" '^server/'
          area gosdk "$files" '^sdk/go/'
          area python "$files" '^sdk/python/'
          area ruby-sdk "$files" '^sdk/ruby/'
          area c-sdk "$files" '^sdk/c/'
          area cpp-sdk "$files" '^sdk/cpp/'
          area elixir-sdk "$files" '^sdk/elixir/'
          area haskell-sdk "$files" '^sdk/haskell/'
          area lua-sdk "$files" '^sdk/lua/'
          area zig-sdk "$files" '^sdk/zig/'
          area typescript "$files" '^sdk/typescript/'
          area web "$files" '^web/'
          area windows "$files" '^scripts/|^install\.ps1$|^setup\.ps1$|^Makefile$|^server/go\.(mod|sum)$|^server/cmd/|^web/(package\.json|pnpm-lock\.yaml|vite\.config\.ts)$'
          # The docs tests alone, when the docs changed but no Go code did
          # (go runs every test anyway).
          if [ "$all" != true ] && ! grep -q '^server/' <<<"$code" && grep -qE "$embedded" <<<"$files"; then
            echo "docs=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "docs=false" | tee -a "$GITHUB_OUTPUT"
          fi

  go:
    name: go (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # A full run's -race tests on hosted macOS take the longest.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Vet
        working-directory: server
        run: go vet ./...

      # -race only in a full run: it is several times slower (internal/api
      # takes about 5 minutes with it). It needs cgo and a C toolchain, which
      # Windows runners are not set up for; the server itself builds with
      # CGO_ENABLED=0 everywhere.
      - name: Test the server and CLI
        working-directory: server
        env:
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$FULL" = true ] && [ "$RUNNER_OS" != Windows ]; then
            go test -race -timeout 25m ./...
          else
            go test -timeout 15m ./...
          fi

      - name: Cross compile for Windows arm64
        if: runner.os == 'Linux'
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=arm64 go vet ./...

  # Only the embedded docs changed: the tests that read them, on Linux.
  docs:
    name: embedded docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test the docs
        working-directory: server
        run: go test ./internal/api -run '^(TestDocs|TestControlMCPResourcesAndPrompts|TestGateLocksDashboardRoutes|TestGateOffChangesNothing)'

  go-sdk:
    name: go sdk (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.gosdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The server's toolchain, as before this job was split out: Go 1.22.0
      # (the SDK's minimum) builds test binaries current macOS refuses to run.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Test
        working-directory: sdk/go
        run: go test ./...

  python-sdk:
    name: python sdk (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Test
        working-directory: sdk/python
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q

  # Standard library and minitest only, so there is nothing to install.
  ruby-sdk:
    name: ruby sdk (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.ruby-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Test
        working-directory: sdk/ruby
        run: |
          ruby --version
          ruby -w -Ilib -Itest test/test_acnologia.rb
          gem build acnologia.gemspec

  c-sdk:
    name: c sdk (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.c-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test (Linux and macOS, with AddressSanitizer and UndefinedBehaviorSanitizer)
        if: runner.os != 'Windows'
        working-directory: sdk/c
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev; fi
          cmake -S . -B build -DACN_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        working-directory: sdk/c
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Debug
          ctest --test-dir build -C Debug --output-on-failure

  cpp-sdk:
    name: cpp sdk (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cpp-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test (Linux and macOS)
        if: runner.os != 'Windows'
        working-directory: sdk/cpp
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        working-directory: sdk/cpp
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

  elixir-sdk:
    name: elixir sdk (${{ matrix.os }}, elixir ${{ matrix.elixir }}, otp ${{ matrix.otp }})
    needs: changes
    if: needs.changes.outputs.elixir-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported pair uses the SDK's own HTTP client (inets
        # before 9.6). It runs on ubuntu-24.04: hex.pm builds no OTP 25 for
        # the newer image ubuntu-latest points at. Windows only in a full run.
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"os":"ubuntu-24.04","elixir":"1.18","otp":"25"},{"os":"ubuntu-latest","elixir":"1.20","otp":"29"},{"os":"windows-latest","elixir":"1.20","otp":"29"}]' || '[{"os":"ubuntu-24.04","elixir":"1.18","otp":"25"},{"os":"ubuntu-latest","elixir":"1.20","otp":"29"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Test
        working-directory: sdk/elixir
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test
          ACNOLOGIA_TEST_HTTP=raw mix test

  haskell-sdk:
    name: haskell sdk (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.haskell-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/haskell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.18.2.0"

      - run: cabal update
      - run: cabal build all --dry-run

      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-9.14.1-${{ hashFiles('sdk/haskell/dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ runner.os }}-ghc-9.14.1-

      - run: cabal build all --only-dependencies
      - run: cabal build all
      - run: cabal test --test-show-details=direct

  lua-sdk:
    name: lua sdk (${{ matrix.os }}, ${{ matrix.lua }})
    needs: changes
    if: needs.changes.outputs.lua-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # LuaJIT cannot load the luarocks.org manifest any more (more than
        # 65536 constants), so CI cannot install the test rocks for it.
        # Lua 5.1 covers the same language level; run LuaJIT locally.
        lua: ["5.1", "5.4"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: ${{ matrix.lua }}

      - uses: leafo/gh-actions-luarocks@v4

      - name: Test
        working-directory: sdk/lua
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libssl-dev; fi
          luarocks install luasocket
          if [ "$RUNNER_OS" = macOS ]; then luarocks install luasec OPENSSL_DIR="$(brew --prefix openssl@3)"; else luarocks install luasec; fi
          luarocks install busted
          busted

  zig-sdk:
    name: zig sdk (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.zig-sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Test
        working-directory: sdk/zig
        run: zig build test --summary all

  typescript-sdk:
    name: typescript sdk (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        working-directory: sdk/typescript
        run: |
          npm install -g pnpm@10.24.0
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck

  web:
    name: dashboard build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        working-directory: web
        run: |
          npm install -g pnpm@10.24.0
          pnpm install --frozen-lockfile
          pnpm build

  # The Windows developer path: scripts/build.ps1 instead of make, the
  # dashboard built by pnpm on Windows, and both binaries started once.
  windows-build:
    name: windows build (build.ps1)
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Parse install.ps1 and scripts/build.ps1 in Windows PowerShell 5.1 and
      # PowerShell 7 without running them.
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $files = @('install.ps1', 'setup.ps1', 'scripts/build.ps1')
          foreach ($exe in @('powershell', 'pwsh')) {
            foreach ($f in $files) {
              $path = (Resolve-Path $f).Path
              & $exe -NoProfile -Command "`$e = `$null; [void][System.Management.Automation.Language.Parser]::ParseFile('$path', [ref]`$null, [ref]`$e); if (`$e) { `$e | ForEach-Object { Write-Error `$_.ToString() }; exit 1 }"
              if ($LASTEXITCODE -ne 0) { throw "$f does not parse in $exe" }
              Write-Host "$f parses in $exe"
            }
          }

      - name: Build with build.ps1
        shell: pwsh
        run: |
          npm install -g pnpm@10.24.0
          ./scripts/build.ps1
          ./scripts/build.ps1 cli
          ./bin/acnologia.exe version
          ./bin/acn.exe version
          if ($LASTEXITCODE -ne 0) { throw "acn.exe version failed" }
